name: Deploy backend to Lambda

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rentanora-backend-production
  cancel-in-progress: false

jobs:
  build:
    name: Build Lambda package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: '21'
          cache: maven

      - name: Build and test
        env:
          COGNITO_USER_POOL_ID: us-east-1_test
          COGNITO_CLIENT_ID: ci-test-client
          COGNITO_CLIENT_SECRET: ci-test-secret
        run: bash ./mvnw --batch-mode --no-transfer-progress -Plambda clean package

      - name: Save Lambda package
        uses: actions/upload-artifact@v7
        with:
          name: lambda-package
          path: target/rentanora-backend-0.0.1-SNAPSHOT-lambda.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Checkout infrastructure
        uses: actions/checkout@v7
        with:
          persist-credentials: false

  deploy:
    name: Deploy to Lambda
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      id-token: write

    env:
      LAMBDA_FUNCTION_NAME: ${{ vars.LAMBDA_FUNCTION_NAME }}

    steps:
      - name: Download Lambda package
        uses: actions/download-artifact@v8
        with:
          name: lambda-package
          path: package/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: '070389302498'

      - name: Validate verification infrastructure
        shell: bash
        run: |
          aws cloudformation validate-template \
            --template-body file://infrastructure/contact-verification.yaml \
            --region us-east-1 \
            --no-cli-pager

      - name: Deploy verification infrastructure
        shell: bash
        run: |
          aws cloudformation deploy \
            --template-file infrastructure/contact-verification.yaml \
            --stack-name rentanora-contact-verification \
            --region us-east-1 \
            --no-fail-on-empty-changeset \
            --no-cli-pager

      - name: Deploy backend code
        shell: bash
        run: |
          : "${LAMBDA_FUNCTION_NAME:?Set LAMBDA_FUNCTION_NAME}"

          aws lambda update-function-code \
            --function-name "$LAMBDA_FUNCTION_NAME" \
            --zip-file fileb://package/rentanora-backend-0.0.1-SNAPSHOT-lambda.zip \
            --query '{FunctionName:FunctionName,LastUpdateStatus:LastUpdateStatus}' \
            --output json

          aws lambda wait function-updated-v2 \
            --function-name "$LAMBDA_FUNCTION_NAME"

          aws lambda get-function-configuration \
            --function-name "$LAMBDA_FUNCTION_NAME" \
            --query '{FunctionName:FunctionName,LastUpdateStatus:LastUpdateStatus,LastModified:LastModified}' \
            --output json