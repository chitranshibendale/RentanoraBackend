AWSTemplateFormatVersion: '2010-09-09'
Description: Rentanora signup verification storage and security key
Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3

Parameters:
  VerificationTableName:
    Type: String
    Default: rentanora-contact-verification
    Description: DynamoDB table for temporary verification records

Resources:
  VerificationHashSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Protect verification codes with a server-only HMAC key.
        must:
          - Never expose the secret value through API responses or logs.
          - Preserve the key while verification records depend on it.
    Properties:
      Name: !Sub '${AWS::StackName}-otp-key'
      Description: Server-side key for protecting Rentanora verification codes
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true
        IncludeSpace: false
      Tags:
        - Key: Application
          Value: Rentanora
        - Key: Purpose
          Value: ContactVerification

  ContactVerificationTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Ref VerificationTableName
      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S

      KeySchema:
        - AttributeName: id
          KeyType: HASH

      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

      Tags:
        - Key: Application
          Value: Rentanora
        - Key: Purpose
          Value: ContactVerification

Outputs:
  VerificationHashSecretArn:
    Description: ARN of the verification code protection key
    Value: !Ref VerificationHashSecret

  VerificationTableName:
    Description: Contact verification table name
    Value: !Ref ContactVerificationTable

  VerificationTableArn:
    Description: Contact verification table ARN
    Value: !GetAtt ContactVerificationTable.Arn